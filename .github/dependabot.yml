# RFC S-6: GitHub Actions の SHA ピンを週次で追従する
# RFC D-2 / PR-S2: tool/deploy の wrangler lockfile を週次で追従する
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tool/deploy
    schedule:
      interval: weekly
