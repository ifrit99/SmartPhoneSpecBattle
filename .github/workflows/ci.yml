# PR の品質ゲート: 静的解析・ユニットテスト・Web ビルド確認
# トリガー: master 宛ての Pull Request / 手動実行
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR の連続 push では最新の実行のみ有効
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Flutter SDK をセットアップ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 依存関係をインストール
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: ユニットテスト
        run: flutter test

      - name: Web ビルド確認
        run: flutter build web --release --base-href "/" --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} --dart-define=SENTRY_RELEASE=${{ github.sha }} --dart-define=SITE_URL=https://smartphonespecbattle.pages.dev/
