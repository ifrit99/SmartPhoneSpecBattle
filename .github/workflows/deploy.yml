# Cloudflare Pages へ Flutter Web を Direct Upload するワークフロー
# トリガー: master ブランチへの push / 手動実行（master 以外はジョブをスキップ）
# RFC: docs/rfc_hosting_foundation.md PR-2（M-1, M-2, M-4, M-5, M-7）
# RFC: docs/rfc_security_hardening.md D-2 / PR-S2（wrangler を lockfile で固定）
#
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID は GitHub Environment `production`
# のシークレットを参照する。deploy ジョブだけが environment: production を宣言する。
# リポジトリ secrets には置かない（RFC S-7 / M-4）。
# if だけではブランチ側の workflow 改変を止められない。Environment の
# Deployment branches を master に限ることが必須。
#
# wrangler は tool/deploy/package-lock.json で本体と依存を固定する。
# 更新は Dependabot の npm（directory: /tool/deploy）。npx --yes wrangler@… は使わない。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 正規 URL（RFC M-2）。初回デプロイでプロジェクトが作られ、URL はそこで確定する。
env:
  SITE_URL: https://smartphonespecbattle.pages.dev
  CF_PAGES_PROJECT: smartphonespecbattle

# 配置は Cloudflare API トークンのみ。GitHub Pages 権限は不要。
permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Flutter SDK をセットアップ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 依存関係をインストール
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: ユニットテスト
        run: flutter test

      - name: Web ビルド
        run: flutter build web --release --base-href "/" --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} --dart-define=SENTRY_RELEASE=${{ github.sha }} --dart-define=SITE_URL=${{ env.SITE_URL }}/ --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: OGP 画像の絶対パスを設定
        run: |
          sed -i "s|content=\"ogp.png\"|content=\"${SITE_URL}/ogp.png\"|g" build/web/index.html

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: web-release
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Node.js をセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/deploy/package-lock.json

      - name: ビルド成果物をダウンロード
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: web-release
          path: build/web

      - name: wrangler を lockfile からインストール
        run: npm ci --ignore-scripts --prefix tool/deploy

      - name: Cloudflare Pages に Direct Upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --prefix tool/deploy wrangler --version
          # 初回はプロジェクトを作成する。既存なら create をスキップ。
          if ! npx --prefix tool/deploy wrangler pages project list | grep -F "${CF_PAGES_PROJECT}"; then
            npx --prefix tool/deploy wrangler pages project create "${CF_PAGES_PROJECT}" --production-branch=master
          fi
          # RFC M-7: Git 連携しない。master のみ本番配置し、プレビュー枝は作らない。
          npx --prefix tool/deploy wrangler pages deploy build/web \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch=master \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=true
