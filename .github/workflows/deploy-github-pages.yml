# ロールバック用（RFC M-5）。現行の自動配置は使わない。
# Cloudflare Pages が失敗したとき: このワークフローを workflow_dispatch で実行し、
# GitHub Pages を一時的に戻す。通常運用では動かさない。
# 再開を自動化したい場合のみ on.push.branches に master を戻す。
# トリガー: 手動実行のみ（master push では動かない）
name: Deploy to GitHub Pages (rollback)

on:
  workflow_dispatch:

# GitHub Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を防止（最新の実行のみ有効）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Flutter SDK をセットアップ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 依存関係をインストール
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: ユニットテスト
        run: flutter test

      - name: Web ビルド
        run: flutter build web --release --base-href "/SmartPhoneSpecBattle/" --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} --dart-define=SENTRY_RELEASE=${{ github.sha }}

      - name: OGP 画像の絶対パスを設定
        run: |
          # GitHub Pages の URL に合わせて OGP 画像パスを絶対 URL に書き換え
          SITE_URL="https://ifrit99.github.io/SmartPhoneSpecBattle"
          sed -i "s|content=\"ogp.png\"|content=\"${SITE_URL}/ogp.png\"|g" build/web/index.html

      - name: GitHub Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
